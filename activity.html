<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6b46" />
  <title>SugboCents - Activity</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mascot.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <script>(function () { if (localStorage.getItem("darkModeEnabled") === "true") document.documentElement.classList.add("dark-mode"); }());</script>
  <script>(function(){if(localStorage.getItem("sidebarCollapsed")==="true")document.documentElement.classList.add("sidebar-collapsed");}());</script>
</head>
<body data-page="activity" data-protected="true" class="antialiased"
  style="background:#f7f3e8;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;color:#102b1d;min-height:100vh">

  <div style="min-height:100vh;background:#f7f3e8">
    <div id="appShell" class="lg:flex">


      <main id="mainContent" class="min-w-0 flex-1 pb-28 lg:pb-8">

        <!-- Page skeleton (visible while auth resolves; removed by revealPageContent() in app.js) -->
        <div id="pageSkeleton" class="mx-auto max-w-6xl space-y-5 px-4 py-5 sm:px-6 lg:px-8" aria-hidden="true" style="pointer-events:none">
          <!-- Summary hero -->
          <div style="height:8.5rem;border-radius:2rem;background:#1f5e3a;opacity:0.4"></div>
          <!-- Tab switcher -->
          <div style="display:flex;gap:0.5rem">
            <div class="sk" style="width:5rem;height:2.25rem;border-radius:9999px"></div>
            <div class="sk" style="width:5rem;height:2.25rem;border-radius:9999px"></div>
            <div class="sk" style="width:5rem;height:2.25rem;border-radius:9999px"></div>
          </div>
          <!-- Expense list card -->
          <div class="sk-card">
            <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
              <div class="sk" style="width:7rem;height:0.75rem"></div>
              <div class="sk" style="width:4rem;height:0.75rem"></div>
            </div>
            <div style="display:flex;flex-direction:column">
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0;border-bottom:1px solid #f5f2eb"><div class="sk sk-circle" style="width:2.75rem;height:2.75rem;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="width:7rem;height:0.7rem;margin-bottom:0.4rem"></div><div class="sk" style="width:5rem;height:0.55rem"></div></div><div class="sk" style="width:4rem;height:0.7rem"></div></div>
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0;border-bottom:1px solid #f5f2eb"><div class="sk sk-circle" style="width:2.75rem;height:2.75rem;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="width:5rem;height:0.7rem;margin-bottom:0.4rem"></div><div class="sk" style="width:6rem;height:0.55rem"></div></div><div class="sk" style="width:3.5rem;height:0.7rem"></div></div>
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0;border-bottom:1px solid #f5f2eb"><div class="sk sk-circle" style="width:2.75rem;height:2.75rem;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="width:9rem;height:0.7rem;margin-bottom:0.4rem"></div><div class="sk" style="width:4rem;height:0.55rem"></div></div><div class="sk" style="width:5rem;height:0.7rem"></div></div>
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0;border-bottom:1px solid #f5f2eb"><div class="sk sk-circle" style="width:2.75rem;height:2.75rem;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="width:6rem;height:0.7rem;margin-bottom:0.4rem"></div><div class="sk" style="width:3.5rem;height:0.55rem"></div></div><div class="sk" style="width:4.5rem;height:0.7rem"></div></div>
              <div style="display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0"><div class="sk sk-circle" style="width:2.75rem;height:2.75rem;flex-shrink:0"></div><div style="flex:1"><div class="sk" style="width:8rem;height:0.7rem;margin-bottom:0.4rem"></div><div class="sk" style="width:4.5rem;height:0.55rem"></div></div><div class="sk" style="width:3rem;height:0.7rem"></div></div>
            </div>
          </div>
        </div>

        <!-- Activity content -->
        <div id="pageContent" class="mx-auto max-w-6xl space-y-5 px-4 py-5 sm:px-6 lg:px-8" style="display:none">

          <!-- ── Weekly Summary Hero ─────────────────────── -->
          <section class="rounded-[2rem] p-5 text-white shadow-lg" style="background:#164f33"
            aria-label="Weekly spending summary">
            <p class="text-xs font-extrabold uppercase tracking-[0.2em]" style="color:rgba(255,255,255,0.55)">Weekly summary</p>
            <div class="mt-2 flex flex-wrap items-baseline gap-2">
              <span class="font-display text-4xl font-black" id="activityWeekSpent">&#8369;0</span>
              <span class="text-sm font-bold" style="color:rgba(255,255,255,0.65)">of
                <span id="activityWeekBudget">&#8369;0</span> budget</span>
            </div>
            <!-- Progress bar -->
            <div class="mt-3 h-2 w-full rounded-full" style="background:rgba(255,255,255,0.2)">
              <div id="activityWeekProgress" class="h-full rounded-full" style="background:rgba(255,255,255,0.85);width:0%;transition:width 0.4s ease"></div>
            </div>
            <!-- 3 stat chips -->
            <div class="mt-4 flex flex-wrap gap-3">
              <div class="rounded-2xl px-4 py-2.5" style="background:rgba(255,255,255,0.12)">
                <p class="text-xs font-extrabold uppercase tracking-[0.14em]" style="color:rgba(255,255,255,0.6)">Logs</p>
                <p id="activityLogsCount" class="font-display text-xl font-black">0</p>
              </div>
              <div class="rounded-2xl px-4 py-2.5" style="background:rgba(255,255,255,0.12)">
                <p class="text-xs font-extrabold uppercase tracking-[0.14em]" style="color:rgba(255,255,255,0.6)">Week XP</p>
                <p id="activityWeekXpVal" class="font-display text-xl font-black" style="color:#FCD34D">+0</p>
              </div>
              <div class="rounded-2xl px-4 py-2.5" style="background:rgba(255,255,255,0.12)">
                <p class="text-xs font-extrabold uppercase tracking-[0.14em]" style="color:rgba(255,255,255,0.6)">Streak</p>
                <p id="activityWeekStreakVal" class="font-display text-xl font-black" style="color:#FB923C">0 &#x1F525;</p>
              </div>
            </div>
          </section>

          <!-- ── Tab Switcher ───────────────────────────── -->
          <div class="grid grid-cols-2 rounded-full p-1" style="background:#e7e0cf" role="tablist" aria-label="View switcher">
            <button id="tabExpenses" type="button" role="tab" aria-selected="true" aria-controls="expensesTabPanel"
              class="rounded-full px-4 py-3 text-sm font-black transition"
              style="background:white;color:#102b1d;box-shadow:0 1px 4px rgba(0,0,0,0.1)">
              Expenses
            </button>
            <button id="tabActivity" type="button" role="tab" aria-selected="false" aria-controls="activityTabPanel"
              class="rounded-full px-4 py-3 text-sm font-black transition"
              style="color:#657064">
              Activity Feed
            </button>
          </div>

          <!-- ── Expenses Tab Panel ─────────────────────── -->
          <div id="expensesTabPanel" role="tabpanel" aria-labelledby="tabExpenses">
            <div class="rounded-[2rem] bg-white shadow-sm" style="outline:1px solid #ded7c6;overflow:hidden">

              <!-- Search + filters sticky header -->
              <div class="p-5 sm:p-6" style="border-bottom:1px solid #f0ece0">
                <!-- Search bar -->
                <div class="relative mb-4">
                  <svg class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2" width="15" height="15"
                    viewBox="0 0 24 24" fill="none" stroke="#8b9490" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input id="activitySearch" type="search"
                    class="w-full rounded-2xl py-3 pl-10 pr-4 text-sm font-semibold outline-none"
                    style="background:#faf8f1;border:1px solid #d8d1bd;color:#102b1d"
                    placeholder="Search expenses&hellip;" aria-label="Search expenses" autocomplete="off" />
                </div>

                <!-- Period chips -->
                <div class="mb-3 flex flex-wrap gap-2" role="group" aria-label="Filter by period">
                  <button type="button" data-period="today"
                    class="rounded-full px-3 py-1.5 text-xs font-extrabold transition"
                    style="background:#f4f0e5;color:#526257">Today</button>
                  <button type="button" data-period="week"
                    class="rounded-full px-3 py-1.5 text-xs font-extrabold transition"
                    style="background:#f4f0e5;color:#526257">This Week</button>
                  <button type="button" data-period="month"
                    class="rounded-full px-3 py-1.5 text-xs font-extrabold transition"
                    style="background:#f4f0e5;color:#526257">This Month</button>
                  <button type="button" data-period="all"
                    class="rounded-full px-3 py-1.5 text-xs font-extrabold transition active"
                    style="background:#164f33;color:white">All Time</button>
                </div>

                <!-- Category chips -->
                <div id="categoryFilter" class="flex flex-wrap gap-2" role="group" aria-label="Filter by category"></div>

                <!-- Count label -->
                <p id="activityCount" class="mt-3 text-xs font-semibold" style="color:#8b9490"></p>
              </div>

              <!-- Expense list -->
              <div id="activityList" class="divide-y px-5 pb-5 sm:px-6 sm:pb-6" style="border-color:#f0ece0"></div>

              <!-- Empty state -->
              <div id="emptyActivity" class="hidden px-5 py-12 text-center sm:px-6">
                <div class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-2xl"
                  style="background:#f4f0e5">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a0a896"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                  </svg>
                </div>
                <p class="font-display text-lg font-black" style="color:#102b1d">No expenses yet</p>
                <p class="mt-1 text-sm font-semibold" style="color:#617063">Expenses you log will appear here.</p>
              </div>

            </div>
          </div>

          <!-- ── Activity Feed Tab Panel ────────────────── -->
          <div id="activityTabPanel" role="tabpanel" aria-labelledby="tabActivity" style="display:none">
            <div id="activityFeedList" class="space-y-3">
              <!-- JS renders activity events here -->
              <div class="rounded-[2rem] bg-white p-5 shadow-sm flex items-center gap-4" style="outline:1px solid #ded7c6">
                <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-white shadow-sm text-2xl" style="background:#f4f0e5">&#x1F4C5;</div>
                <div class="min-w-0 flex-1">
                  <p class="font-display text-base font-black" style="color:#102b1d">Activity feed loading&hellip;</p>
                  <p class="text-sm font-semibold" style="color:#617063">Your events will appear here</p>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /content -->
      </main>
    </div>
  </div>

  <!-- Hidden XP bar elements (used by activity.js renderXpMiniBar) -->
  <div aria-hidden="true" style="display:none">
    <span id="xpMiniLevel"></span>
    <div id="xpMiniTrack" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div id="xpMiniFill" style="width:0%"></div>
    </div>
    <span id="xpMiniStreak"></span>
  </div>

  <!-- Undo toast -->
  <div id="undoToast" class="undo-toast hidden" role="status" aria-live="polite">
    <span id="undoToastMsg">Expense removed</span>
    <button type="button" id="undoToastBtn" class="undo-btn">Undo</button>
  </div>

  <!-- FLOATING TIGOM CHAT FAB -->
  <a href="chat.html" class="fixed z-30 grid place-items-center rounded-full shadow-2xl transition lg:bottom-6"
    style="bottom:5.5rem;right:1rem;height:4rem;width:4rem;background:white;outline:2px solid rgba(22,79,51,0.15);box-shadow:0 8px 32px rgba(16,43,29,0.2);text-decoration:none"
    aria-label="Open Tigom AI chat">
    <div class="relative h-10 w-10" aria-hidden="true">
      <div class="absolute left-1.5 top-0 h-4 w-4 rounded-full" style="background:#2b8259"></div>
      <div class="absolute right-1.5 top-0 h-4 w-4 rounded-full" style="background:#2b8259"></div>
      <div class="absolute inset-1 rounded-[38%_38%_44%_44%]"
        style="background:#2b8259;box-shadow:inset 0 -8px 0 rgba(22,79,51,0.26)"></div>
      <div class="absolute left-[27%] top-[36%] h-2.5 w-2.5 rounded-full" style="background:rgba(255,255,255,0.8)"></div>
      <div class="absolute right-[27%] top-[36%] h-2.5 w-2.5 rounded-full" style="background:rgba(255,255,255,0.8)"></div>
      <div class="absolute left-[31%] top-[39%] h-2 w-2 rounded-full" style="background:#102b1d"></div>
      <div class="absolute right-[31%] top-[39%] h-2 w-2 rounded-full" style="background:#102b1d"></div>
      <div class="absolute bottom-[26%] left-1/2 rounded-b-full"
        style="height:3px;width:1.5rem;border-bottom:3px solid #102b1d;transform:translateX(-50%)"></div>
      <div class="absolute -bottom-1 left-1/2 flex h-5 w-6 items-center justify-center rounded-full text-[0.55rem] font-black"
        style="background:#f7f3e8;color:#164f33;transform:translateX(-50%)">&#8369;</div>
    </div>
  </a>


  <script src="js/chrome.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/firebase-auth-service.js"></script>
  <script src="js/firestore-service.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/chat-ai.js"></script>
  <script src="js/mascot.js"></script>
</body>
</html>
