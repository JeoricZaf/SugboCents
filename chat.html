<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#164f33" />
  <title>SugboCents - Chat with Tigom</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <script>(function(){if(localStorage.getItem("darkModeEnabled")==="true")document.documentElement.classList.add("dark-mode");}());</script>
  <script>(function(){if(localStorage.getItem("sidebarCollapsed")==="true")document.documentElement.classList.add("sidebar-collapsed");}());</script>
    <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TIGOM FACE — 1-to-1 from App.tsx TigomFace()
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .tigom-face {
      position: relative; flex-shrink: 0;
      animation: tigomFloat 4s ease-in-out infinite;
    }
    .tigom-face--sm { width: 3rem; height: 3rem; }
    .tigom-face--md { width: 4rem; height: 4rem; }
    .tigom-face--lg { width: 6rem; height: 6rem; }
    .tigom-face .tf-ear-l {
      position: absolute; left: 0.5rem; top: 0;
      width: 1.25rem; height: 1.25rem;
      border-radius: 9999px; background: #2b8259;
    }
    .tigom-face .tf-ear-r {
      position: absolute; right: 0.5rem; top: 0;
      width: 1.25rem; height: 1.25rem;
      border-radius: 9999px; background: #2b8259;
    }
    .tigom-face .tf-head {
      position: absolute; inset: 0.25rem;
      border-radius: 38% 38% 44% 44%;
      background: #2b8259;
      box-shadow: inset 0 -10px 0 rgba(22,79,51,0.26);
    }
    .tigom-face .tf-eye-white-l {
      position: absolute; left: 27%; top: 36%;
      width: 0.75rem; height: 0.75rem;
      border-radius: 9999px; background: rgba(255,255,255,0.8);
    }
    .tigom-face .tf-eye-white-r {
      position: absolute; right: 27%; top: 36%;
      width: 0.75rem; height: 0.75rem;
      border-radius: 9999px; background: rgba(255,255,255,0.8);
    }
    .tigom-face .tf-pupil-l {
      position: absolute; left: 31%; top: 39%;
      width: 0.625rem; height: 0.625rem;
      border-radius: 9999px; background: #102b1d;
    }
    .tigom-face .tf-pupil-r {
      position: absolute; right: 31%; top: 39%;
      width: 0.625rem; height: 0.625rem;
      border-radius: 9999px; background: #102b1d;
    }
    .tigom-face[data-mood="alarmed"] .tf-pupil-l,
    .tigom-face[data-mood="alarmed"] .tf-pupil-r { width: 0.75rem; height: 0.75rem; }
    .tigom-face .tf-mouth {
      position: absolute; bottom: 26%; left: 50%;
      width: 2rem; height: 1rem; transform: translateX(-50%);
      border-bottom: 4px solid #102b1d;
      border-radius: 0 0 9999px 9999px;
    }
    .tigom-face[data-mood="neutral"] .tf-mouth {
      bottom: 27%; height: 0.25rem;
      border: none; border-radius: 9999px; background: #102b1d;
    }
    .tigom-face[data-mood="worried"] .tf-mouth {
      bottom: 22%; height: 1rem; border-bottom: none;
      border-top: 4px solid #102b1d;
      border-radius: 9999px 9999px 0 0; background: transparent;
    }
    .tigom-face[data-mood="alarmed"] .tf-mouth {
      bottom: 22%; width: 1rem; height: 1rem;
      border: none; border-radius: 9999px; background: #102b1d;
    }
    .tigom-face .tf-badge {
      position: absolute; bottom: -0.25rem; left: 50%;
      transform: translateX(-50%);
      width: 2rem; height: 1.5rem; border-radius: 9999px;
      background: #f7f3e8;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 900; color: #164f33;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       KEYFRAMES
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @keyframes tigomFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40%           { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TYPING DOTS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .typing-dot {
      height: 0.45rem; width: 0.45rem; border-radius: 9999px;
      background: #164f33;
      animation: typingBounce 1s ease-in-out infinite;
      display: inline-block;
    }
    .typing-dot.delay-150 { animation-delay: 150ms; }
    .typing-dot.delay-300 { animation-delay: 300ms; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       BASE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    html, body { background: #f7f3e8; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       MAIN CHAT COLUMN (flex-col, full viewport height)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-main-col {
      min-width: 0; flex: 1;
      display: flex; flex-direction: column;
      height: calc(100dvh - 4rem); /* bottom-nav on mobile */
      overflow: hidden;
    }
    @media (min-width: 1024px) {
      .chat-main-col { height: 100dvh; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       CHAT APP MAIN (row: thread-drawer + chat-page-wrap)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-app-main {
      flex: 1;
      display: flex; flex-direction: row;
      overflow: hidden; position: relative;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       THREAD DRAWER (conversations sidebar)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-sidebar {
      position: fixed; left: 0; top: 0; height: 100dvh; width: 280px;
      padding: 1.1rem 1rem;
      background: #f7f3e8; border-right: 1px solid #d8d1bd;
      flex-shrink: 0; display: flex; flex-direction: column; gap: 0.5rem;
      z-index: 50; transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    .chat-sidebar-overlay {
      display: none; position: fixed; inset: 0; z-index: 49;
      background: rgba(16,43,29,0.35); backdrop-filter: blur(2px);
      border: none; cursor: default; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .chat-app-main.is-sidebar-open .chat-sidebar  { transform: translateX(0); }
    .chat-app-main.is-sidebar-open .chat-sidebar-overlay {
      display: block; opacity: 1; pointer-events: auto;
    }
    .chat-sidebar-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 0.6rem; border-bottom: 1px solid #d8d1bd; margin-bottom: 0.4rem;
    }
    .chat-sidebar-title {
      font-family: "Sora", sans-serif;
      font-size: 0.9rem; font-weight: 800; color: #102b1d;
    }
    .chat-new-thread-btn {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 9999px; border: none;
      background: rgba(44,130,89,0.12); color: #164f33; cursor: pointer;
    }
    .chat-new-thread-btn:hover { background: rgba(44,130,89,0.22); }
    .chat-sidebar-close {
      display: flex; align-items: center; justify-content: center;
      width: 1.9rem; height: 1.9rem; border-radius: 9999px; border: none;
      background: #e7e0cf; color: #617063; cursor: pointer;
    }
    .chat-sidebar-close:hover { background: #d8d1bd; }
    .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
    .chat-history-empty { font-size: 0.82rem; color: #617063; font-weight: 600; padding: 0.5rem 0.25rem; }
    .chat-thread-row {
      display: flex; align-items: center; gap: 0.25rem;
      border-radius: 1rem; padding: 0.1rem 0.1rem 0.1rem 0;
    }
    .chat-thread-row.is-active { background: #edf7ef; }
    .chat-thread-main {
      flex: 1; min-width: 0; text-align: left; border: none; background: transparent;
      border-radius: 0.9rem; padding: 0.55rem 0.75rem; cursor: pointer;
    }
    .chat-thread-main:hover { background: rgba(22,79,51,0.06); }
    .chat-thread-title { font-size: 0.82rem; font-weight: 700; color: #102b1d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-thread-meta  { font-size: 0.7rem; color: #617063; margin-top: 0.15rem; font-weight: 600; }
    .chat-thread-delete {
      flex-shrink: 0; width: 1.9rem; height: 1.9rem;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; border-radius: 9999px;
      color: #94a3b8; cursor: pointer;
    }
    .chat-thread-delete:hover { background: rgba(185,28,28,0.1); color: #b91c1c; }

    /* ── Desktop: permanent conversation panel ── */
    @media (min-width: 1024px) {
      .chat-sidebar {
        position: relative; left: auto; top: auto; z-index: 1;
        height: 100%; width: 240px; transform: none !important; transition: none; box-shadow: none;
      }
      .chat-sidebar-overlay { display: none !important; }
      .chat-sidebar-close { display: none !important; }
      #chatSidebarToggle { display: none !important; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       CHAT PAGE WRAP — mx-auto flex max-w-4xl flex-col
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-page-wrap {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      max-width: 56rem; margin: 0 auto; width: 100%;
      padding: 1.25rem 1rem 0; height: 100%; overflow: hidden;
    }
    @media (min-width: 640px)  { .chat-page-wrap { padding-left: 1.5rem; padding-right: 1.5rem; } }
    @media (min-width: 1024px) { .chat-page-wrap { padding-left: 2rem; padding-right: 2rem; } }

    /* ── Header card — rounded-[2rem] bg-white p-4 shadow-sm ring-1 ring-[#ded7c6] ── */
    .chat-header-card {
      display: flex; align-items: center; gap: 1rem;
      border-radius: 2rem; background: #ffffff; padding: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
      outline: 1px solid #ded7c6; flex-shrink: 0;
    }
    .chat-header-text { min-width: 0; flex: 1; }
    .chat-header-title {
      font-family: "Sora", sans-serif;
      font-size: 1.25rem; font-weight: 900; color: #102b1d;
    }
    .chat-header-sub { font-size: 0.875rem; font-weight: 600; color: #617063; }
    .chat-active-badge {
      display: flex; align-items: center; gap: 0.5rem;
      border-radius: 9999px; background: #edf7ef;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem; font-weight: 900; color: #164f33;
      white-space: nowrap; flex-shrink: 0;
    }
    .chat-active-dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 9999px; background: #2b8259; flex-shrink: 0;
    }
    .chat-header-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; }
    .chat-icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 2.25rem; height: 2.25rem; border-radius: 9999px; border: none;
      background: transparent; color: #617063; cursor: pointer;
    }
    .chat-icon-btn:hover { background: #f0ece0; color: #102b1d; }

    /* ── Messages — scrollbar-none flex-1 space-y-4 overflow-y-auto py-5 ── */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 1.25rem 0;
      display: flex; flex-direction: column; gap: 1rem;
      scrollbar-width: none;
    }
    .chat-messages::-webkit-scrollbar { display: none; }
    .chat-date-label {
      text-align: center; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.18em; color: #7a817a;
      flex-shrink: 0; margin-bottom: 0.25rem;
    }
    .chat-msg { display: flex; gap: 0.75rem; }
    .chat-msg--user { justify-content: flex-end; }
    .chat-msg--bot  { justify-content: flex-start; }
    .chat-bubble {
      max-width: 82%; border-radius: 1.5rem;
      padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 600;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
    }
    .chat-msg--user .chat-bubble { background: #164f33; color: #ffffff; }
    .chat-msg--bot  .chat-bubble { background: #ffffff; color: #26372c; outline: 1px solid #ded7c6; }
    .chat-bubble-time { display: block; margin-top: 0.25rem; font-size: 0.65rem; font-weight: 700; color: #7a817a; }
    .dark-mode .chat-bubble-time { color: #6e7681; }
    .chat-typing-bubble {
      display: flex; align-items: center; gap: 0.25rem;
      border-radius: 1.5rem; background: #ffffff; padding: 1rem;
      outline: 1px solid #ded7c6;
    }
    .chat-resume-sep {
      display: flex; align-items: center; gap: 0.6rem;
      color: #7a817a; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
    }
    .chat-resume-sep::before, .chat-resume-sep::after {
      content: ""; flex: 1; height: 1px; background: #e7e0cf;
    }
    .chat-welcome-block { display: flex; flex-direction: column; gap: 1.1rem; align-items: center; justify-content: center; text-align: center; margin: auto; padding: 1.5rem 1rem; }
    .chat-welcome-heading { font-family: "Sora", sans-serif; font-size: 1.5rem; font-weight: 800; color: #102b1d; margin: 0; }
    .chat-welcome-sub { font-size: 0.875rem; font-weight: 600; color: #617063; max-width: 26rem; line-height: 1.6; margin: 0; }
    .chat-suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; max-width: 32rem; }
    @media (min-width: 640px) { .chat-suggestions { justify-content: center; } }
    .chat-suggestion-btn {
      border-radius: 9999px; background: #ffffff; outline: 1px solid #ded7c6;
      padding: 0.625rem 1.25rem; font-size: 0.8rem; font-weight: 700; color: #164f33;
      border: none; cursor: pointer; text-align: center;
    }
    .chat-suggestion-btn:hover { background: #edf7ef; outline-color: #2b8259; }

    /* ── Suggested prompts — wrapping pill row ── */
    .chat-prompts-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; padding-bottom: 0.5rem;
      flex-shrink: 0;
    }
    .chat-prompt-pill {
      flex-shrink: 0; border-radius: 9999px; background: #ffffff;
      outline: 1px solid #ded7c6; padding: 0.5rem 1rem;
      font-size: 0.75rem; font-weight: 900; color: #164f33;
      border: none; cursor: pointer; white-space: nowrap;
    }
    .chat-prompt-pill:hover { background: #edf7ef; outline-color: #2b8259; }

    /* ── Header action pill buttons (History / New) ── */
    .chat-header-pill {
      display: flex; align-items: center; gap: 0.35rem;
      border-radius: 9999px; padding: 0.375rem 0.875rem;
      font-size: 0.75rem; font-weight: 800;
      border: 1.5px solid #d8d1bd; background: #fff;
      color: #164f33; cursor: pointer; white-space: nowrap;
      font-family: "Plus Jakarta Sans", sans-serif;
      transition: background 0.15s, border-color 0.15s;
    }
    .chat-header-pill:hover { background: #edf7ef; border-color: #2b8259; }

    /* ── Consistent timestamps — outside bubble, aligned per side ── */
    .chat-msg-body { display: flex; flex-direction: column; }
    .chat-msg--user .chat-msg-body { align-items: flex-end; }
    .chat-msg--bot  .chat-msg-body { align-items: flex-start; }

    /* ── Centered welcome / empty state ── */
    .chat-messages.is-empty { justify-content: center; }
    .chat-messages.is-empty .chat-date-label { display: none; }
    .chat-messages.is-empty ~ .chat-prompts-bar { display: none; }

    .chat-attribution {
      font-size: 0.72rem; color: #9ca3af; font-weight: 600;
      text-align: center; padding: 0.25rem 0; flex-shrink: 0;
    }

    /* ── Input footer — rounded-[2rem] bg-white p-3 shadow-xl ring-1 ring-[#ded7c6] ── */
    .chat-footer {
      display: flex; align-items: center; gap: 0.75rem;
      border-radius: 2rem; background: #ffffff; padding: 0.75rem;
      box-shadow: 0 20px 25px -5px rgba(16,43,29,0.1), 0 8px 10px -6px rgba(16,43,29,0.1);
      outline: 1px solid #ded7c6; flex-shrink: 0; margin-bottom: 0.75rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
      transition: outline-color 0.2s ease, box-shadow 0.2s ease;
    }
    .chat-footer:focus-within {
      outline-color: #2b8259;
      outline-width: 2px;
      box-shadow: 0 0 0 4px rgba(43,130,89,0.1), 0 20px 25px -5px rgba(16,43,29,0.1);
    }
    .chat-footer-input {
      min-width: 0; flex: 1; background: transparent; border: none; outline: none;
      font-size: 0.875rem; font-weight: 600; color: #102b1d;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .chat-footer-input::placeholder { color: #9ca3af; font-weight: 600; }
    .chat-send-btn {
      border-radius: 9999px; background: #164f33;
      padding: 0.75rem 1.25rem; font-size: 0.875rem; font-weight: 900; color: #ffffff;
      border: none; cursor: pointer; flex-shrink: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .chat-send-btn:hover { background: #2b8259; }
    .chat-send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Scroll-to-bottom ── */
    .chat-scroll-btn {
      position: absolute; right: 1rem; bottom: 10rem;
      width: 2.25rem; height: 2.25rem; border-radius: 9999px;
      background: #164f33; color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(22,79,51,0.3); z-index: 10;
    }
    .chat-scroll-btn.hidden { display: none; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       OFFLINE LAYER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-connection-layer {
      position: absolute; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      background: rgba(247,243,232,0.82); backdrop-filter: blur(4px);
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .chat-connection-layer.is-visible { opacity: 1; pointer-events: auto; }
    .chat-connection-card {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      background: #fff; border-radius: 2rem; padding: 2rem 2.5rem;
      outline: 1px solid #ded7c6; box-shadow: 0 8px 24px rgba(16,43,29,0.1);
    }
    .chat-connection-spinner {
      width: 2rem; height: 2rem; border-radius: 9999px;
      border: 3px solid #e7e0cf; border-top-color: #2b8259;
      animation: spin 0.9s linear infinite;
    }
    .chat-connection-title { font-family: "Sora", sans-serif; font-size: 1rem; font-weight: 800; color: #102b1d; }
    .chat-connection-sub   { font-size: 0.82rem; font-weight: 600; color: #617063; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       INFO TOAST
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .chat-info-toast {
      position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%);
      background: #164f33; color: #fff;
      padding: 0.65rem 1.25rem; border-radius: 9999px;
      font-size: 0.82rem; font-weight: 700;
      z-index: 100; max-width: 90vw; text-align: center;
      box-shadow: 0 4px 12px rgba(22,79,51,0.3);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RATE COUNT
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #chatRateCount.rate-warn  { color: #b45309; font-weight: 700; }
    #chatRateCount.rate-limit { color: #b42318; font-weight: 700; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       DARK MODE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .dark-mode html, .dark-mode body { background: #0d1117; }
    .dark-mode .chat-main-col       { background: #0d1117; }
    .dark-mode .chat-app-main       { background: #0d1117; }
    .dark-mode .chat-header-card    { background: #161b22; outline-color: #30363d; }
    .dark-mode .chat-header-title   { color: #e6edf3; }
    .dark-mode .chat-header-sub     { color: #8b949e; }
    .dark-mode .chat-active-badge   { background: rgba(74,201,146,0.12); color: #4ac992; }
    .dark-mode .chat-active-dot     { background: #4ac992; }
    .dark-mode .chat-icon-btn       { color: #8b949e; }
    .dark-mode .chat-icon-btn:hover { background: #21262d; color: #e6edf3; }
    .dark-mode .chat-messages       { background: #0d1117; }
    .dark-mode .chat-page-wrap      { background: #0d1117; }
    .dark-mode .chat-msg--bot .chat-bubble  { background: #1c2128; color: #e6edf3; outline-color: #30363d; }
    
    .dark-mode .chat-typing-bubble  { background: #1c2128; outline-color: #30363d; }
    .dark-mode .typing-dot          { background: #4ac992; }
    .dark-mode .chat-date-label     { color: #6e7681; }
    .dark-mode .chat-resume-sep     { color: #6e7681; }
    .dark-mode .chat-resume-sep::before,
    .dark-mode .chat-resume-sep::after { background: #30363d; }
    .dark-mode .chat-prompt-pill    { background: #1c2128; outline-color: #30363d; color: #4ac992; }
    .dark-mode .chat-prompt-pill:hover { background: #21262d; outline-color: rgba(74,201,146,0.4); }
    .dark-mode .chat-suggestion-btn { background: #1c2128; outline-color: #30363d; color: #4ac992; }
    .dark-mode .chat-footer         { background: #161b22; outline-color: #30363d; box-shadow: none; }
    .dark-mode .chat-footer:focus-within { outline-color: #4ac992; outline-width: 2px; box-shadow: 0 0 0 4px rgba(74,201,146,0.15); }
    .dark-mode .chat-footer-input   { color: #e6edf3; }
    .dark-mode .chat-footer-input::placeholder { color: #6e7681; }
    .dark-mode .chat-sidebar        { background: #0d1117; border-right-color: #21262d; }
    .dark-mode .chat-sidebar-title  { color: #e6edf3; }
    .dark-mode .chat-sidebar-head   { border-bottom-color: #21262d; }
    .dark-mode .chat-thread-title   { color: #e6edf3; }
    .dark-mode .chat-thread-meta    { color: #6e7681; }
    .dark-mode .chat-thread-delete  { color: #6e7681; }
    .dark-mode .chat-thread-delete:hover { background: rgba(248,81,73,0.12); color: #f85149; }
    .dark-mode .chat-history-empty  { color: #6e7681; }
    .dark-mode .chat-new-thread-btn { background: rgba(74,201,146,0.12); color: #4ac992; }
    .dark-mode .chat-sidebar-close  { background: #21262d; color: #8b949e; }
    .dark-mode .chat-connection-card  { background: #161b22; outline-color: #30363d; }
    .dark-mode .chat-connection-title { color: #e6edf3; }
    .dark-mode .chat-connection-sub   { color: #8b949e; }
    .dark-mode .chat-connection-spinner { border-color: #30363d; border-top-color: #4ac992; }
    .dark-mode .tigom-face .tf-badge  { background: #0d1117; }
    .dark-mode .chat-thread-row.is-active { background: rgba(74,201,146,0.1); }
    .dark-mode .chat-header-pill { background: #1c2128; border-color: #30363d; color: #4ac992; }
    .dark-mode .chat-header-pill:hover { background: #21262d; border-color: rgba(74,201,146,0.4); }
    .dark-mode .chat-welcome-heading { color: #e6edf3; }
    .dark-mode .chat-welcome-sub     { color: #8b949e; }
    .dark-mode .chat-sidebar         { border-right-color: #21262d; }

    /* embedded mode (iframe) */
    body.chat-embedded nav[aria-label="Main navigation"] { display: none !important; }
    body.chat-embedded .chat-sidebar  { display: none; }
  </style>
</head>
<body data-page="chat" data-protected="true" class="antialiased"
      style="background:#f7f3e8;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;color:#102b1d">

  <div style="min-height:100vh;background:#f7f3e8">
    <div id="appShell" class="lg:flex" style="height:100dvh;overflow:hidden">


      <!-- ═══════════════════════════════════════════════════════
           MAIN CHAT COLUMN
           ═══════════════════════════════════════════════════════ -->
      <div id="mainContent" class="chat-main-col">


        <!-- ═══════════════════════════════════════════════════════
             CHAT APP MAIN — row of thread-drawer + chat-page-wrap
             ═══════════════════════════════════════════════════════ -->
        <div class="chat-app-main">

          <!-- Overlay backdrop for thread drawer -->
          <button id="chatSidebarOverlay" class="chat-sidebar-overlay" aria-label="Close conversations"></button>

          <!-- Thread drawer (conversations list) -->
          <aside class="chat-sidebar" aria-label="Chat history">
            <div class="chat-sidebar-head">
              <span class="chat-sidebar-title">Conversations</span>
              <div style="display:flex;align-items:center;gap:0.3rem;">
                <button id="chatNewThreadBtn" class="chat-new-thread-btn" type="button" aria-label="New chat" title="New chat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button id="chatSidebarClose" class="chat-sidebar-close" aria-label="Close conversations" type="button">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
            </div>
            <div id="chatHistoryList" class="chat-history-list"></div>
          </aside>

          <!-- ═══════════════════════════════════════════════════
               CHAT PAGE WRAP — ChatPage from App.tsx
               mx-auto flex min-h-[calc(100vh-5.5rem)] max-w-4xl flex-col
               ═══════════════════════════════════════════════════ -->
          <div class="chat-page-wrap">

            <!-- Section 1: header card
                 flex items-center gap-4 rounded-[2rem] bg-white p-4 shadow-sm ring-1 ring-[#ded7c6] -->
            <section class="chat-header-card">
              <!-- hamburger + back buttons -->
              <div class="chat-header-actions">
                <button id="chatBackBtn" class="chat-icon-btn" type="button" aria-label="Back">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
              </div>

              <!-- TigomFace sm -->
              <div class="tigom-face tigom-face--sm" id="chatTigomFace" data-mood="happy" aria-label="Tigom is happy">
                <div class="tf-ear-l"></div>
                <div class="tf-ear-r"></div>
                <div class="tf-head"></div>
                <div class="tf-eye-white-l"></div>
                <div class="tf-eye-white-r"></div>
                <div class="tf-pupil-l"></div>
                <div class="tf-pupil-r"></div>
                <div class="tf-mouth"></div>
                <div class="tf-badge">&#8369;</div>
              </div>

              <!-- title + subtitle -->
              <div class="chat-header-text">
                <h1 class="chat-header-title">Tigom &middot; AI Coach</h1>
                <p class="chat-header-sub" id="chatSubtitle">Your personal budgeting buddy</p>
              </div>

              <!-- History + New Chat pill buttons -->
              <div id="chatHeaderActions" style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0;">
                <button id="chatNewChatHeaderBtn" class="chat-header-pill" type="button" aria-label="Start new chat">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  New
                </button>
                <button id="chatSidebarToggle" class="chat-header-pill" type="button" aria-label="Chat history">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  History
                </button>
              </div>

              <!-- Active badge — flex items-center gap-2 rounded-full bg-[#edf7ef] px-3 py-1 text-xs font-black text-[#164f33] -->
              <span class="chat-active-badge" aria-label="AI active">
                <span class="chat-active-dot"></span>
                Active
              </span>
            </section>

            <!-- Section 2: messages
                 scrollbar-none flex-1 space-y-4 overflow-y-auto py-5 -->
            <section class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat messages">
              <div class="chat-date-label" id="chatDateLabel">Today</div>
            </section>

            <!-- Scroll-to-bottom button -->
            <button id="chatScrollBtn" class="chat-scroll-btn hidden" aria-label="Scroll to latest message" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <!-- Section 3: suggested prompts
                 scrollbar-none flex gap-2 overflow-x-auto pb-2 -->
            <section class="chat-prompts-bar" role="group" aria-label="Quick prompts">
              <button class="chat-prompt-pill" type="button" data-prompt="How's my budget looking this week?">How's my budget looking this week?</button>
              <button class="chat-prompt-pill" type="button" data-prompt="What's my biggest spending category?">What's my biggest spending category?</button>
              <button class="chat-prompt-pill" type="button" data-prompt="Give me a tip to save more.">Give me a tip to save more.</button>
              <button class="chat-prompt-pill" type="button" data-prompt="How close am I to my savings goal?">How close am I to my savings goal?</button>
              <button class="chat-prompt-pill" type="button" data-prompt="What quests should I focus on?">What quests should I focus on?</button>
            </section>

            <!-- Attribution -->
            <div class="chat-attribution">
              Powered by Groq &middot; Llama 3.1 &middot; <span id="chatRateCount"></span>
            </div>

            <!-- Section 4: input footer
                 safe-bottom sticky bottom-0 flex items-center gap-3 rounded-[2rem] bg-white p-3 shadow-xl ring-1 ring-[#ded7c6] -->
            <section class="chat-footer" role="form" aria-label="Send a message">
              <!-- TigomFace sm in footer -->
              <div class="tigom-face tigom-face--sm" id="chatFooterTigomFace" data-mood="happy" aria-hidden="true">
                <div class="tf-ear-l"></div>
                <div class="tf-ear-r"></div>
                <div class="tf-head"></div>
                <div class="tf-eye-white-l"></div>
                <div class="tf-eye-white-r"></div>
                <div class="tf-pupil-l"></div>
                <div class="tf-pupil-r"></div>
                <div class="tf-mouth"></div>
                <div class="tf-badge">&#8369;</div>
              </div>
              <!-- min-w-0 flex-1 bg-transparent text-sm font-semibold outline-none -->
              <input
                id="chatInput"
                type="text"
                class="chat-footer-input"
                placeholder="Ask Tigom anything..."
                maxlength="500"
                autocomplete="off"
                aria-label="Chat message"
              />
              <!-- rounded-full bg-[#164f33] px-5 py-3 text-sm font-black text-white -->
              <button id="chatSendBtn" class="chat-send-btn" type="button" aria-label="Send message">Send</button>
            </section>

          </div><!-- .chat-page-wrap -->

        </div><!-- .chat-app-main -->

      </div><!-- .chat-main-col -->

    </div><!-- lg:flex -->
  </div><!-- outer wrapper -->


  <!-- Delete conversation modal -->
  <div id="chatClearModal" class="modal-backdrop hidden" role="alertdialog" aria-modal="true" aria-labelledby="chatClearModalTitle">
    <div class="modal-sheet" style="max-width:360px;">
      <p class="modal-title" id="chatClearModalTitle">Delete this conversation?</p>
      <p style="font-size:0.85rem;color:#475569;margin:0 0 1.25rem;">This conversation will be permanently deleted. This can't be undone.</p>
      <div class="modal-actions">
        <button id="chatClearModalCancel" class="btn-outline" type="button">Cancel</button>
        <button id="chatClearModalConfirm" class="btn-danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/chrome.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/firebase-auth-service.js"></script>
  <script src="js/firestore-service.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/chat-ai.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
