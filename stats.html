<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6b46" />
  <title>SugboCents - Trophy Room</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;700;800&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/spending-chart.css" />
  <link rel="stylesheet" href="css/mascot.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <script>(function () { if (localStorage.getItem("darkModeEnabled") === "true") document.documentElement.classList.add("dark-mode"); }());</script>
  <script>(function(){if(localStorage.getItem("sidebarCollapsed")==="true")document.documentElement.classList.add("sidebar-collapsed");}());</script>
</head>
<body data-page="stats" data-protected="true" class="antialiased"
  style="background:#f7f3e8;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;color:#102b1d;min-height:100vh">

  <div style="min-height:100vh;background:#f7f3e8">
    <div id="appShell" class="lg:flex">


      <main id="mainContent" class="min-w-0 flex-1 pb-28 lg:pb-8">

        <div class="px-4 pt-6 pb-6 max-w-lg mx-auto">
    <!-- Profile Hero -->
    <header class="mb-6">
      <p class="eyebrow">Trophy Room</p>
      <h1 class="mt-1 text-2xl font-extrabold text-ink">Profile</h1>
    </header>

    <!-- Full XP Widget -->
    <section class="xp-widget mb-6" aria-label="Progress">
      <div class="xp-widget-inner">
        <div class="xp-widget-top">
          <span id="xpLevel" class="level-badge">
            <i class="bi bi-arrow-up-circle-fill" aria-hidden="true"></i>
            Lv. 1 &mdash; Rookie Saver
          </span>
          <span id="xpStreakChip" class="streak-chip streak-chip--cold">
            <i class="bi bi-fire" aria-hidden="true"></i>
            No streak yet
          </span>
        </div>
        <div class="xp-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="XP progress" id="xpBarTrack">
          <div id="xpBar" class="xp-bar-fill" style="width: 0%"></div>
        </div>
        <div class="xp-widget-bottom">
          <span id="xpValue" class="xp-value-label">0 XP</span>
          <span id="xpNextLabel" class="text-xs text-emerald-200/80">next level in &mdash;</span>
        </div>
      </div>
    </section>

    <!-- Achievement Badges -->
    <!-- Personal Records -->
    <section class="mb-6" aria-label="Personal Records">
      <h2 class="text-base font-bold text-ink mb-3">Personal Records</h2>
      <div class="personal-records" id="personalRecords">
        <!-- JS-rendered -->
      </div>
    </section>

    <section class="mb-7" aria-labelledby="badgeGridTitle">
        <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-bold text-ink" id="badgeGridTitle">Achievements</h2>
        <span id="badgeProgress" class="text-xs text-slate-500"></span>
      </div>
      <div id="badgeGrid"></div>
    </section>


        </div>

      </main>
    </div>
  </div>


  <script defer src="js/chrome.js"></script>
  <script defer src="js/firebase-init.js"></script>
  <script defer src="js/firebase-auth-service.js"></script>
  <script defer src="js/firestore-service.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/motion.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/dark-mode.js"></script>
  <script defer src="js/stats.js"></script>
  <script defer src="js/chat-ai.js"></script>
  <script defer src="js/mascot.js"></script>
</body>
</html>
