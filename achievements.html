<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6b46" />
  <title>SugboCents - All Achievements</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;700;800&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <script>(function () { if (localStorage.getItem("darkModeEnabled") === "true") document.documentElement.classList.add("dark-mode"); }());</script>
  <script>(function(){if(localStorage.getItem("sidebarCollapsed")==="true")document.documentElement.classList.add("sidebar-collapsed");}());</script>
</head>
<body data-page="achievements" data-protected="true" class="antialiased"
  style="background:#f7f3e8;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;color:#102b1d;min-height:100vh">

  <div style="min-height:100vh;background:#f7f3e8">
    <div id="appShell" class="lg:flex">


      <main id="mainContent" class="min-w-0 flex-1 pb-28 lg:pb-8">

        <div class="px-4 pt-6 pb-6 max-w-lg mx-auto">

    <!-- Page header with back button -->
    <div class="achievements-page-header">
      <a href="profile.html" class="achievements-back-btn" aria-label="Back to profile">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </a>
      <div>
        <h1 class="text-xl font-extrabold text-ink leading-none">All Achievements</h1>
        <p class="text-xs text-slate-400 mt-0.5" id="badgeProgress">Loading&#8230;</p>
      </div>
    </div>

    <!-- Personal Records -->
    <section class="mb-6" aria-label="Personal Records">
      <h2 class="text-base font-bold text-ink mb-3">Personal Records</h2>
      <div class="personal-records" id="personalRecords">
        <!-- JS-rendered -->
      </div>
    </section>

    <!-- Full badge grid -->
    <section aria-labelledby="badgeGridTitle">
      <h2 class="text-base font-bold text-ink mb-3" id="badgeGridTitle">Awards</h2>
      <div id="badgeGrid"></div>
    </section>

        </div>

      </main>
    </div>
  </div>


  <script defer src="js/chrome.js"></script>
  <script defer src="js/firebase-init.js"></script>
  <script defer src="js/firebase-auth-service.js"></script>
  <script defer src="js/firestore-service.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/motion.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/dark-mode.js"></script>
  <script defer src="js/achievements.js"></script>
</body>
</html>
