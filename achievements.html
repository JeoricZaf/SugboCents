        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </a>
      <div>
        <h1 class="text-xl font-extrabold text-ink leading-none">All Achievements</h1>
        <p class="text-xs text-slate-400 mt-0.5" id="badgeProgress">Loading&#8230;</p>
      </div>
    </div>

    <!-- Personal Records -->
    <section class="mb-6" aria-label="Personal Records">
      <h2 class="text-base font-bold text-ink mb-3">Personal Records</h2>
      <div class="personal-records" id="personalRecords">
        <!-- JS-rendered -->
      </div>
    </section>

    <!-- Full badge grid -->
    <section aria-labelledby="badgeGridTitle">
      <h2 class="text-base font-bold text-ink mb-3" id="badgeGridTitle">Awards</h2>
      <div id="badgeGrid"></div>
